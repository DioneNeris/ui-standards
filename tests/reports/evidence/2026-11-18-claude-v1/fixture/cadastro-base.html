<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Cadastro de fornecedor (fixture sintética)</title></head>
<body>
<main>
  <h1>Cadastro de fornecedor</h1>
  <form id="fornecedor" action="#" method="post">
    <label for="razao">Razão social</label>
    <input id="razao" name="razao" type="text" required>
    <label for="cnpj">CNPJ</label>
    <input id="cnpj" name="cnpj" type="text" inputmode="numeric">
    <div class="acoes">
      <button type="button">Cancelar</button>
      <button type="submit">Salvar fornecedor</button>
    </div>
  </form>
</main>
</body>
</html>
